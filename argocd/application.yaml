apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boardgame
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Akhil300596/gha-demo-java1130.git
    targetRevision: main
    path: .
    directory:
      include: deploy.yml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true